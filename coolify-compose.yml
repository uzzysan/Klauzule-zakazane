# Coolify Compose Configuration for FairPact
# Ten plik jest używany gdy FairPact jest zarządzane przez Coolify (OVH jako zdalny serwer)
# 
# RÓŻNICE względem docker-compose.prod.yml:
# - Używa gotowych obrazów z GHCR (GitHub Container Registry) zamiast budowania
# - Przygotowane dla Coolify deployment
# - Zmienne środowiskowe zarządzane przez Coolify Secrets
#
# WAŻNE: Przed użyciem w Coolify:
# 1. W Settings > Servers > Add Server dodaj OVH (147.135.211.101)
# 2. Wklej klucz prywatny wygenerowany wcześniej
# 3. Upewnij się, że wszystkie zmienne środowiskowe są ustawione w Coolify

services:
  frontend:
    image: ghcr.io/uzzysan/fairpact-frontend:latest
    container_name: fairpact-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Coolify automatycznie wstrzyknie zmienne zdefiniowane w Secrets
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://fairpact.pl}
      - NODE_ENV=production
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend-1:
    image: ghcr.io/uzzysan/fairpact-backend:latest
    container_name: fairpact-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Wszystkie zmienne z .env.production - zarządzane przez Coolify Secrets
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-fairpact-documents}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKER_TIMEOUT=${WORKER_TIMEOUT:-600}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-104857600}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://fairpact.pl,https://www.fairpact.pl}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery-worker-1:
    image: ghcr.io/uzzysan/fairpact-backend:latest
    container_name: fairpact-worker
    restart: unless-stopped
    command: >
      celery -A celery_app worker 
      --loglevel=info 
      --autoscale=10,3 
      -Q celery,documents,sync
      --max-tasks-per-child=50
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-fairpact-documents}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKER_TIMEOUT=${WORKER_TIMEOUT:-600}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-104857600}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://fairpact.pl}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # Worker-specific
      - C_FORCE_ROOT=true
      - PYTHONUNBUFFERED=1
      - MALLOC_ARENA_MAX=2
      - OMP_NUM_THREADS=1
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    mem_limit: 6g
    cpus: 5.0
    depends_on:
      - backend-1

  celery-beat:
    image: ghcr.io/uzzysan/fairpact-backend:latest
    container_name: fairpact-beat
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-fairpact-documents}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    mem_limit: 512m
    cpus: 0.25
    depends_on:
      - backend-1

  prometheus:
    image: prom/prometheus:latest
    container_name: fairpact-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 1g

  grafana:
    image: grafana/grafana:latest
    container_name: fairpact-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=grafana.fairpact.pl
      - GF_SERVER_ROOT_URL=https://grafana.fairpact.pl
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "127.0.0.1:3001:3000"
    mem_limit: 512m
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  huggingface_cache:
